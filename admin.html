<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumens Halloween｜主辦後台</title><link rel="stylesheet" href="admin.css"></head><body><header><a href="index.html">← 返回古堡</a><h1>主辦人控制室</h1><button id="logout" hidden>登出</button></header><main><p id="message" role="status"></p><form id="login"><h2>登入後台</h2><label>主辦密碼<input id="password" type="password" autocomplete="current-password" required maxlength="200"></label><button>登入</button></form><div id="dashboard" hidden><section><div class="section-title"><h2>投票狀態</h2><button id="refresh">重新整理</button></div><p id="summary"></p><strong id="countdown"></strong><p id="totals"></p><div class="actions"><button data-action="start">立即開始</button><button data-action="pause">暫停倒數</button><button data-action="resume">恢復投票</button><button data-action="end" class="danger">結束投票</button><button data-action="publish">公布結果</button></div><p class="hint">暫停會凍結剩餘時間。結束後不能重新開啟；公布結果後一般同仁才看得到票數。</p></section><section><h2>活動時間</h2><form id="settings"><label>預定開始時間（台灣時間）<input id="startAt" type="datetime-local" required></label><label>投票時長（分鐘）<input id="duration" type="number" min="1" max="1440" required></label><p id="calculatedEnd"></p><button>儲存時間</button></form><p class="hint">時間與參賽資料只能在投票開始前調整。</p></section><section><h2>參賽者與照片</h2><p>目前保留三位名額。每位最多 3 張照片，填寫名稱後勾選發布；第一張作為封面。</p><div id="candidates"></div></section><section><h2>投票資格名單</h2><p id="employeeCount"></p><p class="hint">可匯入 JSON 陣列，每筆包含 id（工號）、department（部門）、name（中文姓名）。單欄工號檔案不含姓名，無法帶出身份資料。匯入會取代資格名單，僅活動開始前允許。</p><input type="file" id="employees" accept=".json,.csv,.txt"><button id="importEmployees">匯入工號</button></section><section><h2>主辦人票數統計</h2><div id="results"></div><button id="exportResults">匯出統計 CSV</button></section></div></main><dialog id="confirm"><h2 id="confirmTitle"></h2><p id="confirmText"></p><form method="dialog"><button value="cancel">取消</button><button value="ok" class="danger">確認執行</button></form></dialog><script src="site-config.js"></script><script src="admin.js"></script></body></html>
